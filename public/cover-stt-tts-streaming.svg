<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d">
  <title id="t">Streaming STT and TTS versus a sequential pipeline</title>
  <desc id="d">Sequential STT then LLM then TTS overruns a conversational gap. Streaming first-audio fits in ~410ms.</desc>
  <rect width="1200" height="630" fill="#f8fafc"/>
  <text x="48" y="56" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#94a3b8" letter-spacing="0.18em" font-weight="700">VOICE INTERNALS / 03</text>
  <text x="48" y="100" font-family="ui-sans-serif,system-ui,sans-serif" font-size="28" fill="#0f172a" font-weight="700">Wait for done three times and you are late.</text>

  <text x="48" y="168" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#64748b">Sequential</text>
  <text x="1104" y="168" text-anchor="end" font-family="ui-monospace,monospace" font-size="13" fill="#94a3b8">1430ms</text>
  <rect x="48" y="184" width="344" height="56" fill="#e2e8f0"/>
  <text x="220" y="218" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#0f172a">STT 450</text>
  <rect x="392" y="184" width="536" height="56" fill="#cbd5e1"/>
  <text x="660" y="218" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#0f172a">LLM 700</text>
  <rect x="928" y="184" width="216" height="56" fill="#94a3b8"/>
  <text x="1036" y="218" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#f8fafc">TTS 280</text>

  <text x="48" y="300" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#0f172a" font-weight="600">Streamed</text>
  <text x="1104" y="300" text-anchor="end" font-family="ui-monospace,monospace" font-size="13" fill="#0f172a">410ms</text>
  <rect x="48" y="316" width="176" height="56" fill="#e2e8f0"/>
  <text x="136" y="350" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#0f172a">STT 140</text>
  <rect x="224" y="316" width="224" height="56" fill="#cbd5e1"/>
  <text x="336" y="350" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#0f172a">LLM 180</text>
  <rect x="448" y="316" width="112" height="56" fill="#0f172a"/>
  <text x="504" y="350" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#f8fafc">TTS 90</text>

  <line x1="560" y1="316" x2="560" y2="460" stroke="#0f172a" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="576" y="400" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#0f172a">first audio</text>
  <text x="576" y="428" font-family="ui-monospace,monospace" font-size="12" fill="#64748b">partials · sentence chunk · cancel</text>

  <rect x="48" y="500" width="1104" height="80" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="72" y="548" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" fill="#0f172a">STT websocket ’ LLM tokens ’ TTS first byte. Abort all three on barge-in.</text>
</svg>
