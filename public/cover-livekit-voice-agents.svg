<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 480" width="1600" height="480">
  <rect width="1600" height="480" fill="#f8fafc"/>
  <pattern id="dots" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.4" fill="#e2e8f0"/>
  </pattern>
  <rect width="1600" height="480" fill="url(#dots)"/>

  <!-- Central TaskGroup node at (800,240) -->
  <circle cx="800" cy="240" r="88" fill="#0f766e"/>
  <text x="800" y="222" font-family="ui-monospace,monospace" font-size="14" fill="#f0fdfa" text-anchor="middle">TaskGroup(</text>
  <text x="800" y="242" font-family="ui-monospace,monospace" font-size="12" fill="#99f6e4" text-anchor="middle">stay &#8594; room &#8594;</text>
  <text x="800" y="260" font-family="ui-monospace,monospace" font-size="12" fill="#99f6e4" text-anchor="middle">contact &#8594; extras</text>
  <text x="800" y="280" font-family="ui-monospace,monospace" font-size="14" fill="#f0fdfa" text-anchor="middle">)</text>

  <!-- STT box: top-left -->
  <line x1="728" y1="186" x2="558" y2="122" stroke="#0f172a" stroke-width="2"/>
  <rect x="370" y="40" width="188" height="80" rx="10" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
  <text x="464" y="72"  font-family="ui-monospace,monospace" font-size="13" fill="#0f172a" text-anchor="middle">STT</text>
  <text x="464" y="92"  font-family="ui-monospace,monospace" font-size="12" fill="#64748b" text-anchor="middle">hearing</text>

  <!-- Turn detector box: bottom-left -->
  <line x1="728" y1="294" x2="558" y2="358" stroke="#0f172a" stroke-width="2"/>
  <rect x="370" y="320" width="188" height="80" rx="10" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
  <text x="464" y="352" font-family="ui-monospace,monospace" font-size="12" fill="#0f172a" text-anchor="middle">TurnDetector()</text>
  <text x="464" y="372" font-family="ui-monospace,monospace" font-size="12" fill="#64748b" text-anchor="middle">end of utterance</text>

  <!-- LLM box: top-right -->
  <line x1="872" y1="186" x2="1042" y2="122" stroke="#0f172a" stroke-width="2"/>
  <rect x="1042" y="40" width="188" height="80" rx="10" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
  <text x="1136" y="72"  font-family="ui-monospace,monospace" font-size="13" fill="#0f172a" text-anchor="middle">inference.LLM</text>
  <text x="1136" y="92"  font-family="ui-monospace,monospace" font-size="12" fill="#64748b" text-anchor="middle">thinking</text>

  <!-- TTS box: bottom-right -->
  <line x1="872" y1="294" x2="1042" y2="358" stroke="#0f172a" stroke-width="2"/>
  <rect x="1042" y="320" width="188" height="80" rx="10" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
  <text x="1136" y="352" font-family="ui-monospace,monospace" font-size="13" fill="#0f172a" text-anchor="middle">inference.TTS</text>
  <text x="1136" y="372" font-family="ui-monospace,monospace" font-size="12" fill="#64748b" text-anchor="middle">speaking</text>

  <!-- book_room: far right -->
  <line x1="888" y1="240" x2="1300" y2="240" stroke="#0f172a" stroke-width="2"/>
  <path d="M 1292,233 L 1308,240 L 1292,247" fill="none" stroke="#0f172a" stroke-width="2" stroke-linejoin="round"/>
  <rect x="1310" y="196" width="232" height="88" rx="10" fill="#f8fafc" stroke="#0f766e" stroke-width="2"/>
  <text x="1426" y="228" font-family="ui-monospace,monospace" font-size="13" fill="#0f172a" text-anchor="middle">book_room(</text>
  <text x="1426" y="248" font-family="ui-monospace,monospace" font-size="12" fill="#64748b" text-anchor="middle">plain Python,</text>
  <text x="1426" y="266" font-family="ui-monospace,monospace" font-size="12" fill="#64748b" text-anchor="middle">not a tool</text>

  <text x="52" y="50" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#cbd5e1" letter-spacing="0.18em" font-weight="700">LIVEKIT &#183; VOICE AGENTS</text>
</svg>
