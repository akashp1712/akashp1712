<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 480" width="1600" height="480">
  <rect width="1600" height="480" fill="#f8fafc"/>
  <pattern id="dots" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.4" fill="#e2e8f0"/>
  </pattern>
  <rect width="1600" height="480" fill="url(#dots)"/>

  <text x="52" y="50" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#cbd5e1" letter-spacing="0.18em" font-weight="700">LIVEKIT &#183; VOICE AGENTS</text>

  <!-- Caller utterance: waveform + spoken line -->
  <text x="560" y="64" font-family="ui-monospace,monospace" font-size="10" fill="#94a3b8" letter-spacing="0.14em">CALLER &#183; MID-INTAKE</text>
  <g fill="#0f766e">
    <rect x="560" y="85" width="4" height="14" rx="2"/>
    <rect x="570" y="79" width="4" height="26" rx="2"/>
    <rect x="580" y="73" width="4" height="38" rx="2"/>
    <rect x="590" y="81" width="4" height="22" rx="2"/>
    <rect x="600" y="69" width="4" height="46" rx="2"/>
    <rect x="610" y="77" width="4" height="30" rx="2"/>
    <rect x="620" y="66" width="4" height="52" rx="2"/>
    <rect x="630" y="74" width="4" height="36" rx="2"/>
    <rect x="640" y="80" width="4" height="24" rx="2"/>
    <rect x="650" y="70" width="4" height="44" rx="2"/>
    <rect x="660" y="63" width="4" height="58" rx="2"/>
    <rect x="670" y="76" width="4" height="32" rx="2"/>
    <rect x="680" y="82" width="4" height="20" rx="2"/>
    <rect x="690" y="72" width="4" height="40" rx="2"/>
    <rect x="700" y="78" width="4" height="28" rx="2"/>
    <rect x="710" y="68" width="4" height="48" rx="2"/>
    <rect x="720" y="81" width="4" height="22" rx="2"/>
    <rect x="730" y="86" width="4" height="12" rx="2"/>
  </g>
  <text x="762" y="99" font-family="ui-monospace,monospace" font-size="15" fill="#0f172a">&#8220;Actually &#8212; make it three of us.&#8221;</text>

  <!-- Panel headers -->
  <text x="348" y="140" font-family="ui-monospace,monospace" font-size="11" fill="#94a3b8" text-anchor="middle" letter-spacing="0.12em">WHAT YOU WERE ABOUT TO WRITE</text>
  <text x="1140" y="140" font-family="ui-monospace,monospace" font-size="11" fill="#94a3b8" text-anchor="middle" letter-spacing="0.12em">WHAT THE FRAMEWORK ALREADY RUNS</text>

  <!-- Left panel: the hand-rolled state machine -->
  <rect x="48" y="152" width="600" height="290" rx="14" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
  <text x="68" y="186" font-family="ui-monospace,monospace" font-size="12" fill="#991b1b">@dataclass</text>
  <text x="68" y="205" font-family="ui-monospace,monospace" font-size="12" fill="#991b1b">class CallState:</text>
  <text x="92" y="224" font-family="ui-monospace,monospace" font-size="12" fill="#dc2626">dates: tuple | None</text>
  <text x="92" y="243" font-family="ui-monospace,monospace" font-size="12" fill="#dc2626">guests: int | None</text>
  <text x="92" y="262" font-family="ui-monospace,monospace" font-size="12" fill="#dc2626">room_type: str | None</text>
  <text x="92" y="281" font-family="ui-monospace,monospace" font-size="12" fill="#dc2626">phone: str | None</text>
  <text x="68" y="314" font-family="ui-monospace,monospace" font-size="12" fill="#991b1b">def next_question(s: CallState):</text>
  <text x="92" y="333" font-family="ui-monospace,monospace" font-size="12" fill="#dc2626">if not s.dates:  return ASK_DATES</text>
  <text x="92" y="352" font-family="ui-monospace,monospace" font-size="12" fill="#dc2626">if not s.guests: return ASK_GUESTS</text>
  <text x="92" y="371" font-family="ui-monospace,monospace" font-size="12" fill="#dc2626">...</text>
  <text x="68" y="400" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#991b1b">two systems now decide what happens next</text>
  <text x="68" y="420" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#b91c1c">when they disagree, the bug is invisible from either side</text>

  <!-- Bridge arrow -->
  <line x1="660" y1="297" x2="712" y2="297" stroke="#0f172a" stroke-width="2"/>
  <path d="M 705,290 L 720,297 L 705,304" fill="none" stroke="#0f172a" stroke-width="2" stroke-linejoin="round"/>

  <!-- Right panel: TaskGroup -->
  <rect x="728" y="152" width="824" height="290" rx="14" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
  <text x="756" y="186" font-family="ui-monospace,monospace" font-size="12" fill="#0f172a">TaskGroup(</text>
  <text x="780" y="206" font-family="ui-monospace,monospace" font-size="12" fill="#64748b">StayTask(), RoomTask(),</text>
  <text x="780" y="226" font-family="ui-monospace,monospace" font-size="12" fill="#64748b">GetPhoneNumberTask(), ExtrasTask(),</text>
  <text x="756" y="246" font-family="ui-monospace,monospace" font-size="12" fill="#0f172a">)</text>

  <!-- Ordered intake rail -->
  <rect x="798" y="270" width="150" height="56" rx="10" fill="#0f766e"/>
  <text x="873" y="295" font-family="ui-monospace,monospace" font-size="13" fill="#f0fdfa" text-anchor="middle">stay</text>
  <text x="873" y="313" font-family="ui-monospace,monospace" font-size="11" fill="#99f6e4" text-anchor="middle">dates &#183; guests</text>

  <line x1="950" y1="298" x2="968" y2="298" stroke="#0f172a" stroke-width="2"/>
  <path d="M 963,292 L 975,298 L 963,304" fill="none" stroke="#0f172a" stroke-width="2" stroke-linejoin="round"/>

  <rect x="976" y="270" width="150" height="56" rx="10" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
  <text x="1051" y="295" font-family="ui-monospace,monospace" font-size="13" fill="#0f172a" text-anchor="middle">room</text>
  <text x="1051" y="313" font-family="ui-monospace,monospace" font-size="11" fill="#64748b" text-anchor="middle">fits the party</text>

  <line x1="1128" y1="298" x2="1146" y2="298" stroke="#0f172a" stroke-width="2"/>
  <path d="M 1141,292 L 1153,298 L 1141,304" fill="none" stroke="#0f172a" stroke-width="2" stroke-linejoin="round"/>

  <rect x="1154" y="270" width="150" height="56" rx="10" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
  <text x="1229" y="295" font-family="ui-monospace,monospace" font-size="13" fill="#0f172a" text-anchor="middle">contact</text>
  <text x="1229" y="313" font-family="ui-monospace,monospace" font-size="11" fill="#64748b" text-anchor="middle">read back</text>

  <line x1="1306" y1="298" x2="1324" y2="298" stroke="#0f172a" stroke-width="2"/>
  <path d="M 1319,292 L 1331,298 L 1319,304" fill="none" stroke="#0f172a" stroke-width="2" stroke-linejoin="round"/>

  <rect x="1332" y="270" width="150" height="56" rx="10" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
  <text x="1407" y="295" font-family="ui-monospace,monospace" font-size="13" fill="#0f172a" text-anchor="middle">extras</text>
  <text x="1407" y="313" font-family="ui-monospace,monospace" font-size="11" fill="#64748b" text-anchor="middle">breakfast</text>

  <!-- Regression: caller changes their mind, the group re-runs an earlier task -->
  <path d="M 1229,332 C 1229,372 873,372 873,340" fill="none" stroke="#0f766e" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M 867,347 L 873,333 L 879,347" fill="none" stroke="#0f766e" stroke-width="2" stroke-linejoin="round"/>
  <text x="1140" y="392" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#0f766e" text-anchor="middle">caller changes their mind &#8594; the group re-runs that task, keeps the rest</text>
  <text x="1140" y="414" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#0f172a" text-anchor="middle">the group&#8217;s order is the state machine</text>
</svg>
