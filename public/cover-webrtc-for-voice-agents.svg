<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 480" width="1600" height="480">
  <rect width="1600" height="480" fill="#f8fafc"/>
  <pattern id="dots" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.4" fill="#e2e8f0"/>
  </pattern>
  <rect width="1600" height="480" fill="url(#dots)"/>

  <text x="52" y="50" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#cbd5e1" letter-spacing="0.18em" font-weight="700">DEEP DIVE &#183; WEBRTC</text>

  <!-- Headline -->
  <text x="52" y="96" font-family="ui-sans-serif,system-ui,sans-serif" font-size="28" fill="#0f172a" font-weight="700">The media clock is 20ms. TCP is not.</text>
  <text x="52" y="126" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#64748b">Voice agents need a transport built for live speech &#8212; not documents.</text>

  <!-- ?? Three transports side by side ?? -->

  <!-- HTTP -->
  <rect x="52" y="168" width="460" height="280" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="282" y="206" font-family="ui-monospace,monospace" font-size="11" fill="#94a3b8" text-anchor="middle" letter-spacing="0.12em">HTTP</text>
  <text x="282" y="238" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" fill="#64748b" text-anchor="middle">TCP &#183; request / response</text>

  <!-- stalled packet visual -->
  <rect x="100" y="268" width="48" height="32" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="124" y="289" font-family="ui-monospace,monospace" font-size="11" fill="#94a3b8" text-anchor="middle">pkt</text>
  <rect x="160" y="268" width="48" height="32" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="184" y="289" font-family="ui-monospace,monospace" font-size="11" fill="#dc2626" text-anchor="middle">lost</text>
  <rect x="220" y="268" width="48" height="32" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="244" y="289" font-family="ui-monospace,monospace" font-size="11" fill="#94a3b8" text-anchor="middle">wait</text>
  <rect x="280" y="268" width="48" height="32" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="304" y="289" font-family="ui-monospace,monospace" font-size="11" fill="#94a3b8" text-anchor="middle">wait</text>
  <rect x="340" y="268" width="48" height="32" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="364" y="289" font-family="ui-monospace,monospace" font-size="11" fill="#94a3b8" text-anchor="middle">wait</text>

  <text x="282" y="340" font-family="ui-monospace,monospace" font-size="12" fill="#94a3b8" text-anchor="middle">head-of-line blocking</text>
  <text x="282" y="362" font-family="ui-monospace,monospace" font-size="12" fill="#94a3b8" text-anchor="middle">no audio clock</text>
  <text x="282" y="410" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">fine for documents</text>

  <!-- WebSocket -->
  <rect x="570" y="168" width="460" height="280" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="800" y="206" font-family="ui-monospace,monospace" font-size="11" fill="#94a3b8" text-anchor="middle" letter-spacing="0.12em">WEBSOCKET</text>
  <text x="800" y="238" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" fill="#64748b" text-anchor="middle">TCP &#183; persistent socket</text>

  <!-- persistent but still TCP -->
  <line x1="620" y1="284" x2="980" y2="284" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="700" y="268" width="48" height="32" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="724" y="289" font-family="ui-monospace,monospace" font-size="11" fill="#94a3b8" text-anchor="middle">pkt</text>
  <rect x="760" y="268" width="48" height="32" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="784" y="289" font-family="ui-monospace,monospace" font-size="11" fill="#dc2626" text-anchor="middle">lost</text>
  <line x1="808" y1="284" x2="980" y2="284" stroke="#fecaca" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="900" y="320" font-family="ui-monospace,monospace" font-size="11" fill="#dc2626" text-anchor="middle">entire stream stalls</text>

  <text x="800" y="340" font-family="ui-monospace,monospace" font-size="12" fill="#94a3b8" text-anchor="middle">still retransmits</text>
  <text x="800" y="362" font-family="ui-monospace,monospace" font-size="12" fill="#94a3b8" text-anchor="middle">late frame = audible gap</text>
  <text x="800" y="410" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">fine for transcripts</text>

  <!-- WebRTC (highlighted) -->
  <rect x="1088" y="168" width="460" height="280" rx="14" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
  <text x="1318" y="206" font-family="ui-monospace,monospace" font-size="11" fill="#0f172a" text-anchor="middle" letter-spacing="0.12em">WEBRTC</text>
  <text x="1318" y="238" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" fill="#0f172a" text-anchor="middle">UDP &#183; RTP / Opus</text>

  <!-- 20ms frame stream -->
  <g>
    <rect x="1138" y="268" width="36" height="32" rx="5" fill="#0f766e"/>
    <text x="1156" y="289" font-family="ui-monospace,monospace" font-size="10" fill="#f0fdfa" text-anchor="middle">20ms</text>
    <rect x="1182" y="268" width="36" height="32" rx="5" fill="#0f766e"/>
    <text x="1200" y="289" font-family="ui-monospace,monospace" font-size="10" fill="#f0fdfa" text-anchor="middle">20ms</text>
    <rect x="1226" y="268" width="36" height="32" rx="5" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
    <text x="1244" y="289" font-family="ui-monospace,monospace" font-size="10" fill="#dc2626" text-anchor="middle">skip</text>
    <rect x="1270" y="268" width="36" height="32" rx="5" fill="#0f766e"/>
    <text x="1288" y="289" font-family="ui-monospace,monospace" font-size="10" fill="#f0fdfa" text-anchor="middle">20ms</text>
    <rect x="1314" y="268" width="36" height="32" rx="5" fill="#0f766e"/>
    <text x="1332" y="289" font-family="ui-monospace,monospace" font-size="10" fill="#f0fdfa" text-anchor="middle">20ms</text>
    <rect x="1358" y="268" width="36" height="32" rx="5" fill="#0f766e"/>
    <text x="1376" y="289" font-family="ui-monospace,monospace" font-size="10" fill="#f0fdfa" text-anchor="middle">20ms</text>
    <rect x="1402" y="268" width="36" height="32" rx="5" fill="#0f766e"/>
    <text x="1420" y="289" font-family="ui-monospace,monospace" font-size="10" fill="#f0fdfa" text-anchor="middle">20ms</text>
    <rect x="1446" y="268" width="36" height="32" rx="5" fill="#0f766e"/>
    <text x="1464" y="289" font-family="ui-monospace,monospace" font-size="10" fill="#f0fdfa" text-anchor="middle">20ms</text>
  </g>
  <text x="1318" y="320" font-family="ui-monospace,monospace" font-size="11" fill="#0f766e" text-anchor="middle">late packet dropped &#183; timeline keeps moving</text>

  <text x="1318" y="340" font-family="ui-monospace,monospace" font-size="12" fill="#0f172a" text-anchor="middle">jitter buffer + PLC</text>
  <text x="1318" y="362" font-family="ui-monospace,monospace" font-size="12" fill="#0f172a" text-anchor="middle">bidirectional at once</text>
  <text x="1318" y="410" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="600">the voice path</text>
  <text x="1318" y="432" font-family="ui-monospace,monospace" font-size="11" fill="#64748b" text-anchor="middle">960 samples &#183; 48kHz &#183; 50 fps</text>
</svg>
