<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d">
  <title id="t">WebRTC vs HTTP for voice agents</title>
  <desc id="d">Three transports: HTTP and WebSocket stall on TCP. WebRTC keeps a 20ms media clock on UDP.</desc>
  <rect width="1200" height="630" fill="#f8fafc"/>
  <text x="48" y="56" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#94a3b8" letter-spacing="0.18em" font-weight="700">DEEP DIVE</text>
  <text x="48" y="100" font-family="ui-sans-serif,system-ui,sans-serif" font-size="28" fill="#0f172a" font-weight="700">The media clock is 20ms. TCP is not.</text>

  <rect x="48" y="156" width="352" height="396" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="224" y="200" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#94a3b8" letter-spacing="0.12em">HTTP</text>
  <text x="224" y="248" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" fill="#64748b">TCP / request-response</text>
  <text x="224" y="300" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" fill="#94a3b8">HOL blocking</text>
  <text x="224" y="336" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" fill="#94a3b8">no audio clock</text>
  <text x="224" y="400" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#94a3b8">fine for documents</text>

  <rect x="424" y="156" width="352" height="396" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="600" y="200" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#94a3b8" letter-spacing="0.12em">WEBSOCKET</text>
  <text x="600" y="248" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" fill="#64748b">TCP / persistent</text>
  <text x="600" y="300" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" fill="#94a3b8">still retransmits</text>
  <text x="600" y="336" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" fill="#94a3b8">late = stall</text>
  <text x="600" y="400" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#94a3b8">fine for transcripts</text>

  <rect x="800" y="156" width="352" height="396" rx="8" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
  <text x="976" y="200" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#0f172a" letter-spacing="0.12em">WEBRTC</text>
  <text x="976" y="248" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" fill="#0f172a">UDP / RTP + Opus</text>
  <text x="976" y="300" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" fill="#0f172a">late = skip</text>
  <text x="976" y="336" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" fill="#0f172a">jitter buffer + PLC</text>
  <text x="976" y="400" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#0f172a">the voice path</text>
  <text x="976" y="468" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#64748b">960 samples / 20ms</text>
</svg>
